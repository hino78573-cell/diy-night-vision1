<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed B&W Night Vision Cam</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        h1 { 
            font-size: 14px; 
            margin-bottom: 15px; 
            text-shadow: 0 0 8px rgba(255,255,255,0.6); 
            text-align: center;
        }
        #webcam { display: none; }
        .video-box {
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            width: 95%;
            max-width: 640px;
            background-color: #050505;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .status-bar {
            margin-top: 10px;
            font-size: 11px;
            color: #888888;
        }
    </style>
</head>
<body>

    <h1>👁️ FIXED DIGITAL NIGHT VISION (B&W MODE)</h1>
    
    <!-- បន្ថែមអាគុយម៉ង់ playsinline និង muted ដើម្បីកុំឱ្យទូរសព្ទ iPhone គាំងផ្ទាំងស -->
    <video id="webcam" autoplay playsinline muted></video>
    
    <div class="video-box">
        <canvas id="nightCanvas"></canvas>
    </div>

    <div class="status-bar">📡 SYSTEM: STABLE ISO GAIN • FLASH: OFF</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('nightCanvas');
        const ctx = canvas.getContext('2d');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
                // បញ្ជាឱ្យវីដេអូចាប់ផ្តើមរត់ដាច់ខាតលើប្រព័ន្ធ iOS
                video.play();
            } catch (err) {
                alert("សូមចុចអនុញ្ញាត (Allow) ឱ្យបើកកាមេរ៉ា ដើម្បីដំណើរការប្រព័ន្ធ!");
            }
        }

        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            processFrame();
        });

        // 🔄 កូដគណនាពន្លឺកែសម្រួលថ្មី ទប់ស្កាត់ការឆេះពណ៌ស (Anti-White Screen Algorithmn)
        function processFrame() {
            if (video.paused || video.ended) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = frame.data;

            // កម្រិតដំឡើងពន្លឺមានតុល្យភាពល្មម មិនឱ្យហួសប្រមាណ
            const gamma = 0.40;         // ទាញពន្លឺងងឹតល្មមស្អាត
            const exposureGain = 1.8;   // គុណបង្កើនពន្លឺ ១.៨ ដង (មិនឱ្យឆេះស)
            const baseBrightness = 25;  // ពន្លឺផ្ទៃក្រោយល្មម

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];     
                let g = data[i + 1]; 
                let b = data[i + 2]; 

                // បំប្លែងទៅជាកម្រិតពន្លឺសខ្មៅ (Grayscale)
                let luminance = 0.299 * r + 0.587 * g + 0.114 * b;

                // រូបមន្តពង្រីកពន្លឺបែបមានសុវត្ថិភាព
                let normalized = luminance / 255;
                let boosted = Math.pow(normalized, gamma) * 255;
                
                // គុណមេគុណ Exposure
                boosted = (boosted * exposureGain) + baseBrightness;
                
                // ទប់លំនឹងមិនឱ្យហួសកម្រិត ២៥៥ ដាច់ខាត (ការពារផ្ទាំងពណ៌ស)
                boosted = Math.min(255, Math.max(0, boosted));

                // បង្ហាញលទ្ធផលសខ្មៅម៉ត់ស្អាត
                data[i]     = boosted; 
                data[i + 1] = boosted; 
                data[i + 2] = boosted; 
            }

            ctx.putImageData(frame, 0, 0);
            requestAnimationFrame(processFrame);
        }

        startCamera();
    </script>
</body>
</html>
