<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Black & White Night Vision Cam</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        h1 { 
            font-size: 15px; 
            margin-bottom: 15px; 
            text-shadow: 0 0 8px #ffffff; 
            text-align: center;
        }
        #webcam { display: none; }
        .video-box {
            border: 2px solid #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            width: 95%;
            max-width: 640px;
            background-color: #050505;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .status-bar {
            margin-top: 10px;
            font-size: 12px;
            color: #aaaaaa;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <h1>👁️ DIGITAL IR NIGHT VISION • MODE: BLACK & WHITE</h1>
    
    <video id="webcam" autoplay playsinline></video>
    
    <div class="video-box">
        <canvas id="nightCanvas"></canvas>
    </div>

    <div class="status-bar">📡 SYSTEM: ACTIVE (NO FILTER)</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('nightCanvas');
        const ctx = canvas.getContext('2d');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("សូមអនុញ្ញាត (Allow) ឱ្យបើកកាមេរ៉ាទូរសព្ទ ដើម្បីដំណើរការប្រព័ន្ធមើលយប់!");
            }
        }

        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            processFrame();
        });

        function processFrame() {
            if (video.paused || video.ended) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = frame.data;

            // ល្បឿនបង្កើនពន្លឺឌីជីថល (ដំឡើង ISO កម្រិតខ្ពស់)
            const gamma = 0.35; 
            const brightnessBoost = 40; 

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];     
                let g = data[i + 1]; 
                let b = data[i + 2]; 

                // ១. បំប្លែងទៅជាកម្រិតពន្លឺសខ្មៅ (True Grayscale)
                let luminance = 0.299 * r + 0.587 * g + 0.114 * b;

                // ២. គណនាជម្រុញពន្លឺកន្លែងងងឹតស្លុបឱ្យឡើងភ្លឺ (Gamma Correction)
                let normalized = luminance / 255;
                let boosted = Math.pow(normalized, gamma) * 255 + brightnessBoost;
                
                // ទប់ពន្លឺមិនឱ្យឆេះសខ្លាំងពេក
                boosted = Math.min(255, Math.max(0, boosted));

                // ៣. បញ្ចូលតម្លៃពណ៌ស្មើគ្នាទាំង ៣ ជួរ ដើម្បីឱ្យចេញជាពណ៌សខ្មៅម៉ត់ស្អាត គ្មានឆ្នូត
                data[i]     = boosted; // ពណ៌ក្រហម
                data[i + 1] = boosted; // ពណ៌បៃតង
                data[i + 2] = boosted; // ពណ៌ខៀវ
            }

            ctx.putImageData(frame, 0, 0);
            requestAnimationFrame(processFrame);
        }

        startCamera();
    </script>
</body>
</html>
