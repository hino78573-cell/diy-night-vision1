<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military Native AI Goggles v8.0</title>
    <style>
        /* 🎨 ប្រព័ន្ធរចនាផ្ទាំងអេក្រង់វ៉ែនតាយោធា (Combat HUD Styling) */
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #00ff00;
            overflow: hidden;
            user-select: none;
        }
        h1 { 
            font-size: 13px; 
            margin-bottom: 10px; 
            text-shadow: 0 0 10px #00ff00; 
            text-align: center;
            letter-spacing: 2px;
        }
        #webcam { display: none; }
        .video-box {
            border: 2px solid #00ff00;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            width: 95%;
            max-width: 640px;
            position: relative;
            background-color: #000000;
        }
        /* បន្ថែមខ្សែវាស់មុំបែបវ៉ែនតាកងទ័ព (Crosshair Overlay) */
        .video-box::before {
            content: "+";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 255, 0, 0.6);
            font-size: 28px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 5px #00ff00;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .status-container {
            width: 95%;
            max-width: 640px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .blink-text {
            animation: textBlink 1.5s infinite;
        }
        @keyframes textBlink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <h1>⚡ MILITARY NIGHT VISION • CORE: NATIVE PYTHON AI</h1>
    
    <div class="video-box">
        <video id="webcam" autoplay playsinline muted></video>
        <!-- អេក្រង់ចម្បងបង្ហាញវីដេអូបៃតងម៉ត់ និងប្រអប់ Target Lock ពី Python -->
        <canvas id="nightCanvas"></canvas>
    </div>

    <div class="status-container">
        <span class="blink-text">🔴 SYSTEM: ACTIVE_STREAM</span>
        <span>SYS_GAIN: 800%</span>
        <span>CORE: NATIVE_AI</span>
    </div>

    <!-- 📝 [ចំណាំ]៖ កូដផ្នែកស្គ្រីប JavaScript (Part 2) សម្រាប់បើកកាមេរ៉ា និងផ្ញើទៅ Python នឹងត្រូវដាក់បន្តនៅខាងក្រោមជួរនេះ -->
