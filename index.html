<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIL-SPEC 80% AI Night Vision System</title>
    <style>
        body {
            background-color: #030603;
            color: #00ff55;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        h1 {
            font-size: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #00ff55;
        }
        .video-container {
            margin-top: 10px;
            border: 2px solid #00ff55;
            display: inline-block;
            box-shadow: 0 0 15px #00ff55;
            background: #000;
            position: relative;
        }
        img {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
        }
        .hud-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: #00ff55;
            text-shadow: 0 0 4px #00ff55;
            pointer-events: none;
            text-align: left;
        }
        .status {
            margin-top: 10px;
            font-size: 13px;
            color: #00cc44;
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>[ MIL-SPEC 80% AI NIGHT VISION ]</h1>
    
    <div class="video-container">
        <img src="{{ url_for('video_feed') }}" alt="AI Night Vision Stream">
        <div class="hud-overlay">
            SYS: ACTIVE<br>
            MODE: PVS-14 AI<br>
            GAIN: +80% BOOST
        </div>
        <div class="scanlines"></div>
    </div>

    <div class="status">
        ស្ថានភាព៖ ដំណើរការដោយគ្មានពិល (Starlight AI Sensor) | ម៉ោង៖ <span id="time"></span>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

</body>
</html>
