<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military Grade Green Night Vision</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: #00ff00;
            overflow: hidden;
        }
        h1 { 
            font-size: 13px; 
            margin-bottom: 15px; 
            text-shadow: 0 0 10px #00ff00; 
            text-align: center;
            letter-spacing: 1px;
        }
        .video-box {
            border: 2px solid #00ff00;
            box-shadow: 0 0 35px rgba(0, 255, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            width: 95%;
            max-width: 640px;
            background-color: #000000;
        }
        
        /* 🔄 ប្រព័ន្ធ Matrix Green Core: ជម្រុញពន្លឺ ៦ដង និងដំឡើង Contrast ខ្ពស់បង្អស់ */
        video {
            width: 100%;
            height: auto;
            display: block;
            
            /* ប្រើប្រាស់ SVG Filter បូករួមជាមួយ CSS Effects ដើម្បីទម្លាយភាពងងឹត */
            filter: url(#military-green-matrix) brightness(6.0) contrast(4.0);
            -webkit-filter: url(#military-green-matrix) brightness(6.0) contrast(4.0);
        }
        
        .status-bar {
            margin-top: 12px;
            font-size: 11px;
            color: #00ff00;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>⚡ MILITARY NIGHT VISION • CORE: MATRIX GREEN MAX</h1>
    
    <div class="video-box">
        <!-- រត់វីដេអូចំៗផ្ទាល់ពី Hardware ធានាមិនលោត Error គាំងទៀតឡើយ -->
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="status-bar">📡 SYSTEM: ONLINE • GAIN: 600% • FILTER: PURE GREEN</div>

    <!-- 🟢 បន្ទះកូដពណ៌បៃតងយោធាពិសេស សម្រាប់ស្រូបយកភាគល្អិតពន្លឺតូចៗមកពង្រីកឱ្យច្បាស់ -->
    <svg xmlns="http://w3.org" style="display: none;">
        <filter id="military-green-matrix">
            <feColorMatrix type="matrix" values="
                0.1  0.1  0.1  0  0
                0.5  1.0  0.5  0  0
                0.1  0.1  0.1  0  0
                0    0    0    1  0"/>
        </filter>
    </svg>

    <script>
        const video = document.getElementById('webcam');

        // កូដសុំសិទ្ធិបើកកាមេរ៉ាក្រោយរបស់ទូរសព្ទ
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
                
                // បញ្ជាឱ្យវីដេអូរត់ដាច់ខាត ទោះបីជាលើប្រព័ន្ធទូរសព្ទណាក៏ដោយ
                video.play().catch(e => console.log("Playback failed"));
            } catch (err) {
                alert("សូមចុចអនុញ្ញាត (Allow) ឱ្យបើកកាមេរ៉ា ដើម្បីដំណើរការប្រព័ន្ធមើលយប់!");
            }
        }

        // ដំណើរការភ្លាមៗពេលបើកទំព័រវេបសាយ
        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
